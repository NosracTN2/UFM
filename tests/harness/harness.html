<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Familiar Ledger harness</title>
<style>
  :root { --lumiverse-text: #e8e6e3; --lumiverse-text-dim: #9a978f; --lumiverse-border: rgba(255,255,255,.12); --lumiverse-fill-subtle: rgba(255,255,255,.04); --lumiverse-primary: #c9a35b; --lumiverse-bg-elevated: #1b1b1f; }
  body { margin: 0; background: #121215; color: #e8e6e3; font-family: system-ui, sans-serif; display: grid; grid-template-columns: 320px 1fr 360px; height: 100vh; }
  #drawer, #chat, #dock { overflow: auto; border-right: 1px solid #2a2a30; }
  #chat { display: flex; flex-direction: column; }
  #messages { flex: 1; padding: 12px; overflow: auto; white-space: pre-wrap; font-size: 13px; }
  #composer { width: 100%; height: 90px; background: #1b1b1f; color: #eee; border: 0; border-top: 1px solid #333; padding: 8px; box-sizing: border-box; }
  .modal-back { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 10; }
  .modal { background: #1b1b1f; border: 1px solid #333; border-radius: 10px; max-height: 90vh; overflow: auto; }
  .modal h3 { margin: 0; padding: 10px 14px; border-bottom: 1px solid #333; font-size: 14px; }
  .float { position: fixed; z-index: 5; }
  @media (max-width: 640px) {
    body { grid-template-columns: 1fr; grid-template-rows: 1fr; }
    #drawer { display: none; }
    #dock { position: fixed; left: 0; right: 0; bottom: 0; height: 55vh; background: #17171b; border-top: 1px solid #333; }
  }
</style>
</head>
<body>
<div id="drawer"></div>
<div id="chat"><div id="messages"></div><textarea id="composer" placeholder="Type…"></textarea></div>
<div id="dock"></div>
<script type="module">
const backendHandlers = [];
const eventHandlers = {};
const tagInterceptors = [];
let from = 0;
const composer = document.getElementById("composer");
const composerListeners = [];
function modalFrame(title, width) {
  const back = document.createElement("div"); back.className = "modal-back";
  const box = document.createElement("div"); box.className = "modal"; box.style.width = Math.min(width || 420, window.innerWidth - 24) + "px";
  const h3 = document.createElement("h3"); h3.textContent = title; box.append(h3);
  const root = document.createElement("div"); root.style.padding = "4px"; box.append(root); back.append(box); document.body.append(back);
  const dismissers = [];
  return { root, modalId: String(Math.random()), setTitle: (t) => (h3.textContent = t), dismiss: () => { back.remove(); dismissers.forEach((f) => f()); }, onDismiss: (f) => (dismissers.push(f), () => {}) };
}
const ctx = {
  manifest: { identifier: "ufm_familiar_ledger" },
  deferReady() {}, ready() {},
  dom: { addStyle(css) { const s = document.createElement("style"); s.textContent = css; document.head.append(s); return () => s.remove(); } },
  onBackendMessage(fn) { backendHandlers.push(fn); return () => {}; },
  sendToBackend(p) { fetch("/send", { method: "POST", body: JSON.stringify(p) }); },
  getActiveChat() { return { chatId: "harness-chat", characterId: "c1" }; },
  events: { on(ev, fn) { (eventHandlers[ev] ||= []).push(fn); return () => {}; }, emit() {} },
  messages: { registerTagInterceptor(opts, fn) { tagInterceptors.push({ opts, fn }); return () => {}; } },
  composer: {
    getState: () => ({ mounted: true, chatId: "harness-chat", text: composer.value }),
    onChange: (fn) => (composerListeners.push(fn), () => {}),
    setText: (t) => (composer.value = t),
    insertText: (t) => (composer.value += t),
    focus: () => composer.focus(),
  },
  ui: {
    registerDrawerTab(o) { const root = document.createElement("div"); document.getElementById("drawer").append(root); return { root, tabId: o.id, setBadge() {}, setTitle() {}, setShortName() {}, activate() {}, destroy() { root.remove(); }, onActivate() { return () => {}; } }; },
    requestDockPanel(o) { const root = document.createElement("div"); document.getElementById("dock").append(root); let c = false; return { root, destroy() { root.remove(); }, collapse() { c = true; }, expand() { c = false; }, isCollapsed: () => c, onVisibilityChange() { return () => {}; } }; },
    registerInputBarAction(o) { return { actionId: o.id, onClick() { return () => {}; }, setLabel() {}, setEnabled() {}, destroy() {} }; },
    showModal(o) { return modalFrame(o.title, o.width); },
    showConfirm(o) { return Promise.resolve({ confirmed: true }); },
    createFloatWidget(o) { const root = document.createElement("div"); root.className = "float"; root.style.width = o.width + "px"; root.style.height = o.height + "px"; root.style.left = (o.initialPosition?.x ?? 20) + "px"; root.style.top = (o.initialPosition?.y ?? 80) + "px"; document.body.append(root); return { root, moveTo() {}, setSize() {}, getPosition: () => ({ x: 0, y: 0 }), setVisible: (v) => (root.style.display = v ? "" : "none"), isVisible: () => root.style.display !== "none", onDragEnd() { return () => {}; }, destroy() { root.remove(); } }; },
    registerSettingsTab(o) { const root = document.createElement("div"); root.id = "settings-tab"; document.getElementById("drawer").append(root); return { root, tabId: o.id, registrationId: "s1", setTitle() {}, activate() {}, destroy() { root.remove(); }, onActivate() { return () => {}; } }; },
    mount(point) { const d = document.createElement("div"); d.dataset.mount = point; document.getElementById("drawer").append(d); return d; },
  },
  uploads: { pickFile: async () => [] },
};
window.__ctx = ctx;
window.__fireTag = (tagName, content, attrs = {}, messageId = "g") => {
  for (const t of tagInterceptors) if (t.opts.tagName === tagName) t.fn({ tagName, content, attrs, fullMatch: "", messageId, chatId: "harness-chat", isStreaming: false });
};
async function poll() {
  try {
    const r = await (await fetch("/poll?from=" + from)).json();
    from = r.next;
    for (const m of r.msgs) for (const fn of backendHandlers) fn(m);
    window.__toasts = r.toasts;
    const chat = await (await fetch("/chat")).json();
    document.getElementById("messages").textContent = chat.map((m) => `${m.role}: ${m.swipes[m.swipe_id].replace(/<ufm\b[\s\S]*?<\/ufm>/g, "").replace(/<ufm-setup[^>]*><\/ufm-setup>/g, "")}`).join("\n\n");
  } catch (e) {}
  setTimeout(poll, 120);
}
from = (await (await fetch("/poll?from=999999")).json()).next;
const mod = await import("/frontend.js");
window.__teardown = mod.setup(ctx);
poll();
window.__fireTag("ufm-setup", "", { run: "origin" });
</script>
</body>
</html>
